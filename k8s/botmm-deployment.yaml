apiVersion: apps/v1
kind: Deployment
metadata:
  name: botmm-deployment
  namespace: your-namespace  # ЗАМЕНИТЕ на ваш namespace
  labels:
    app: botmm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: botmm
  template:
    metadata:
      labels:
        app: botmm
    spec:
      containers:
      - name: botmm
        image: your-docker-registry/bot-image:latest  # ЗАМЕНИТЕ на ваш образ
        envFrom:
        - secretRef:
            name: botmm-secret
        - configMapRef:
            name: botmm-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"